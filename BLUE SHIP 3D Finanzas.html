<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLUE SHIP 3D — Control de ingresos y salidas</title>
<style>
:root{--bg:#071433;--p:#0d2153;--p2:#0a1a42;--b:#1c3a7d;--t:#eaf1ff;--d:#8fa6d6;--a:#1e6bff;--c:#22d3ee;--g:#34d399;--r:#f87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12308a 0,var(--bg) 55%) fixed;color:var(--t);font-family:"Segoe UI",system-ui,sans-serif;padding:20px 16px 60px}
.w{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header img{height:64px;border-radius:10px}
h1{margin:0;font-size:1.6rem;letter-spacing:.18em;font-weight:600}h1 span{color:var(--c)}
.sub{color:var(--d);font-size:.85rem;letter-spacing:.05em}
.sp{flex:1}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--b);background:var(--p);color:var(--t);padding:9px 14px;font-weight:600;font-size:.88rem}
button:hover{filter:brightness(1.2)}.pri{background:var(--a);border-color:var(--a)}.out{background:#0e7490;border-color:#0e7490}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px}
.card small{color:var(--d);text-transform:uppercase;font-size:.7rem;letter-spacing:.08em}.card b{display:block;font-size:1.6rem;margin-top:4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:9px;padding:9px 11px;font:inherit;font-size:.9rem;width:100%}
.filters input,.filters select{width:auto;flex:1;min-width:130px}
input:focus,select:focus{outline:none;border-color:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--p2);border:1px solid var(--b);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--d)}.chip b{color:var(--t)}
table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--b);border-radius:14px;overflow:hidden;font-size:.88rem}
th{background:var(--p2);color:var(--d);text-transform:uppercase;font-size:.68rem;letter-spacing:.07em;text-align:left;padding:10px}
td{padding:10px;border-top:1px solid var(--b)}.n{text-align:right;white-space:nowrap;font-weight:600}
.ing{color:var(--g)}.sal{color:var(--r)}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--p2);border:1px solid var(--b)}
.ac button{padding:4px 9px;font-size:.75rem;margin-left:4px}
.tw{overflow-x:auto}.empty{text-align:center;color:var(--d);padding:30px}
.mb{position:fixed;inset:0;background:rgba(2,8,25,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.mb.on{display:flex}
.m{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.m h3{margin:0 0 14px}.m label{display:block;font-size:.68rem;color:var(--d);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rb{display:flex;gap:10px;margin-top:18px}.rb button{flex:1}
.warn{background:#5b2a0a;border:1px solid #b45309;padding:10px;border-radius:9px;margin-bottom:12px;font-size:.85rem;display:none}
</style></head><body><div class="w">

<button class="pri" onclick="abrir('ingreso')">＋ Ingreso</button><button class="out" onclick="abrir('salida')">＋ Salida</button>
<button onclick="exportar()">⬇ Respaldo</button><button onclick="imp.click()">⬆ Restaurar</button><input type="file" id="imp" accept=".json" style="display:none"></header>
<div class="warn" id="warn">⚠ Este navegador bloquea el guardado local. Abrí el archivo directamente en Chrome desde tu PC para que los datos se conserven.</div>
<div class="cards"><div class="card"><small>Ingresos</small><b class="ing" id="ti">$0</b></div><div class="card"><small>Salidas</small><b class="sal" id="ts">$0</b></div><div class="card"><small>Balance</small><b id="tb">$0</b></div></div>
<div class="filters"><input type="month" id="fm"><select id="ft"><option value="">Ingresos y salidas</option><option value="ingreso">Solo ingresos</option><option value="salida">Solo salidas</option></select><select id="fc"></select><input id="fq" placeholder="Buscar..."></div>
<div class="chips" id="chips"></div>
<div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Detalle</th><th class="n">Monto</th><th></th></tr></thead><tbody id="tb2"></tbody></table></div>
</div>
<div class="mb" id="mb"><div class="m"><h3 id="mt"></h3><div id="mf"></div><div class="rb"><button onclick="cerrar()">Cancelar</button><button class="pri" onclick="guardar()">Guardar</button></div></div></div>
<script>
const CATS={ingreso:{"Venta de piezas":[["desc","Cliente / detalle","text"],["pago","Medio de pago","sel",["Efectivo","Transferencia","Mercado Libre","Otro"]],["monto","Monto ($)","number"]],
"Servicio de impresión":[["desc","Cliente / detalle","text"],["pago","Medio de pago","sel",["Efectivo","Transferencia","Mercado Libre","Otro"]],["monto","Monto ($)","number"]],
"Diseño 3D":[["desc","Cliente / detalle","text"],["pago","Medio de pago","sel",["Efectivo","Transferencia","Mercado Libre","Otro"]],["monto","Monto ($)","number"]],
"Otros ingresos":[["desc","Detalle","text"],["monto","Monto ($)","number"]]},
salida:{"Impresoras":[["marca","Marca","text"],["modelo","Modelo","text"],["monto","Precio ($)","number"]],
"Filamentos":[["marca","Marca","text"],["color","Color","text"],["kg","Kg por rollo","number"],["precio","Precio por rollo ($)","number"],["cant","Cantidad de rollos","number"]],
"Herramientas":[["desc","Herramienta","text"],["monto","Monto ($)","number"]],"Insumos":[["desc","Insumo","text"],["monto","Monto ($)","number"]],"Otros":[["desc","Detalle","text"],["monto","Monto ($)","number"]]}};
const KEY="bs3d:v1";let mem=null,DB=[],edit=null,tipo="ingreso";
const $=id=>document.getElementById(id),$$=n=>"$"+n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
function load(){try{DB=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){DB=mem||[];$("warn").style.display="block"}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){mem=DB;$("warn").style.display="block"}}
const detalle=r=>r.cat=="Impresoras"?`${r.d.marca||""} ${r.d.modelo||""}`:r.cat=="Filamentos"?`${r.d.marca||""} ${r.d.color||""} · ${r.d.kg||0} kg × ${r.d.cant||1} (${$$(+r.d.precio/(+r.d.kg||1))}/kg)`:(r.d.desc||"")+(r.d.pago?` · ${r.d.pago}`:"");
function abrir(t,id){tipo=t;edit=id?DB.find(x=>x.id==id):null;if(edit)tipo=edit.tipo;
 const cat=edit?edit.cat:Object.keys(CATS[tipo])[0];$("mt").textContent=(edit?"Editar ":"Nueva ")+(tipo=="ingreso"?"ingreso":"salida");
 $("mf").innerHTML=`<label>Fecha</label><input type="date" id="f_fecha" value="${edit?edit.fecha:new Date().toISOString().slice(0,10)}"><label>Categoría</label><select id="f_cat" onchange="campos(this.value)">${Object.keys(CATS[tipo]).map(c=>`<option ${c==cat?"selected":""}>${c}</option>`).join("")}</select><div id="f_dyn"></div>`;
 campos(cat);$("mb").classList.add("on")}
function campos(cat){const d=edit&&edit.cat==cat?edit.d:{};$("f_dyn").innerHTML=CATS[tipo][cat].map(([k,l,ty,o])=>`<label>${l}</label>`+(ty=="sel"?`<select id="d_${k}">${o.map(x=>`<option ${d[k]==x?"selected":""}>${x}</option>`).join("")}</select>`:`<input id="d_${k}" type="${ty}" ${ty=="number"?'step="0.01" min="0"':""} value="${d[k]??(k=="cant"?1:"")}">`)).join("")}
function cerrar(){$("mb").classList.remove("on")}
function guardar(){const cat=$("f_cat").value,d={};CATS[tipo][cat].forEach(([k])=>d[k]=$("d_"+k).value);
 const monto=cat=="Filamentos"?(+d.precio||0)*(+d.cant||1):+d.monto||0;if(!monto){alert("Ingresá un monto válido.");return}
 const r={id:edit?edit.id:Date.now(),tipo,fecha:$("f_fecha").value,cat,d,monto};
 if(edit)DB[DB.indexOf(edit)]=r;else DB.push(r);save();cerrar();render()}
function borrar(id){if(confirm("¿Eliminar este movimiento?")){DB=DB.filter(x=>x.id!=id);save();render()}}
function render(){const m=$("fm").value,t=$("ft").value,c=$("fc").value,q=$("fq").value.toLowerCase();
 const all=[...new Set([...Object.keys(CATS.ingreso),...Object.keys(CATS.salida)])];if($("fc").options.length!=all.length+1)$("fc").innerHTML='<option value="">Todas las categorías</option>'+all.map(x=>`<option>${x}</option>`).join("");$("fc").value=c;
 const L=DB.filter(r=>(!m||r.fecha.startsWith(m))&&(!t||r.tipo==t)&&(!c||r.cat==c)&&(!q||(detalle(r)+r.cat).toLowerCase().includes(q))).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id);
 const I=L.filter(r=>r.tipo=="ingreso").reduce((s,r)=>s+r.monto,0),S=L.filter(r=>r.tipo=="salida").reduce((s,r)=>s+r.monto,0);
 $("ti").textContent=$$(I);$("ts").textContent=$$(S);$("tb").textContent=$$(I-S);$("tb").className=I-S>=0?"ing":"sal";
 const by={};L.forEach(r=>by[r.cat]=(by[r.cat]||0)+(r.tipo=="ingreso"?r.monto:-r.monto));
 $("chips").innerHTML=Object.entries(by).map(([k,v])=>`<span class="chip">${k}: <b class="${v>=0?"ing":"sal"}">${$$(Math.abs(v))}</b></span>`).join("");
 $("tb2").innerHTML=L.length?L.map(r=>`<tr><td>${r.fecha.split("-").reverse().join("/")}</td><td><span class="tag ${r.tipo=="ingreso"?"ing":"sal"}">${r.tipo=="ingreso"?"Ingreso":"Salida"}</span></td><td>${r.cat}</td><td>${detalle(r)}</td><td class="n ${r.tipo=="ingreso"?"ing":"sal"}">${r.tipo=="ingreso"?"+":"−"}${$$(r.monto)}</td><td class="ac"><button onclick="abrir(0,${r.id})">✎</button><button onclick="borrar(${r.id})">🗑</button></td></tr>`).join(""):'<tr><td colspan="6" class="empty">Sin movimientos. Cargá tu primer ingreso o salida.</td></tr>'}
function exportar(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download="bluship3d-respaldo-"+new Date().toISOString().slice(0,10)+".json";a.click()}
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x))throw 0;if(confirm("Esto reemplaza los datos actuales. ¿Continuar?")){DB=x;save();render()}}catch(_){alert("Archivo inválido")}};rd.readAsText(f)};
["fm","ft","fc","fq"].forEach(i=>$(i).addEventListener("input",render));
load();render();
</script></body></html>
